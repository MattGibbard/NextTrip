name: IndexNow
# After a push to main changes blog posts, guides or hubs, tells Bing and other IndexNow search engines
# which pages to crawl again (scripts/indexnow.mjs).
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "content/destinations/**"
      - "content/hubs/**"
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
