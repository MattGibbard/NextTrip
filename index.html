<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Pick light or dark before the first paint so the page doesn't flash. src/theme.ts keeps it up to date.
      (function () {
        var choice = "system";
        try {
          choice = JSON.parse(localStorage.getItem("nexttrip.theme")) || "system";
        } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#18201d" : "#ffffff");
      })();
    </script>
    <meta name="description" content="Can't decide where to go on holiday? somewhere🎉 lets the whole family add ideas, spread points in secret and let a fair draw pick your next trip. Free to use." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts load alongside the page instead of holding it up: text shows straight away in the
         system font and switches over when they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" /></noscript>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="somewhere🎉" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>somewhere🎉</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The home page and the Guides arrive ready-made for visitors. Someone who was signed in last time
      // sees them inside the app instead, so clear the visitors' version before the first paint rather
      // than flash it at them.
      try {
        var path = location.pathname;
        if ((path === "/" || path === "/destinations" || path.indexOf("/destinations/") === 0) && JSON.parse(localStorage.getItem("nexttrip.signedIn")) === true) {
          document.getElementById("root").replaceChildren();
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
