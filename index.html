<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Pick light or dark before the first paint so the page doesn't flash. src/theme.ts keeps it up to date.
      (function () {
        var choice = "system";
        try {
          choice = JSON.parse(localStorage.getItem("nexttrip.theme")) || "system";
        } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#18201d" : "#ffffff");
      })();
    </script>
    <meta name="description" content="Can't decide where to go on holiday? somewhere🎉 lets the whole family add ideas, spread points in secret and let a fair draw pick your next trip. Free to use." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="somewhere🎉" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>somewhere🎉</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // The home page and the Guides arrive ready-made for visitors. Someone who was signed in last time
      // sees them inside the app instead, so clear the visitors' version before the first paint rather
      // than flash it at them.
      try {
        var path = location.pathname;
        if (JSON.parse(localStorage.getItem("nexttrip.signedIn")) === true) {
          if (path === "/" || path === "/destinations" || path.indexOf("/destinations/") === 0) document.getElementById("root").replaceChildren();
          // Every other public page swaps in the app's header once it's up (src/useSignedIn.ts), so hide the
          // visitors' links and button until then rather than show them and jump.
          else document.documentElement.classList.add("signed-in");
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
