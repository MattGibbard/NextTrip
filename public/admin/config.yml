              - { label: How good, name: rating, widget: select, default: good, options: [{ label: Best, value: best }, { label: Good, value: good }, { label: Quieter, value: quiet }] }
              - { label: Note, name: note, widget: string, required: false, hint: "e.g. Cold, Festive, Hot and busy" }
              - { label: Daytime high (°C), name: temp, widget: number, value_type: int, required: false, hint: "The average daytime high that month, rounded, e.g. 24. Shown on the month tiles and used for \"Where's hot\" on the month pages." }
          - label: December
            name: dec
            widget: object
            collapsed: true
            summary: "{{rating}}: {{note}} ({{temp}}°)"
            fields:
              - { label: How good, name: rating, widget: select, default: good, options: [{ label: Best, value: best }, { label: Good, value: good }, { label: Quieter, value: quiet }] }
              - { label: Note, name: note, widget: string, required: false, hint: "e.g. Cold, Festive, Hot and busy" }
              - { label: Daytime high (°C), name: temp, widget: number, value_type: int, required: false, hint: "The average daytime high that month, rounded, e.g. 24. Shown on the month tiles and used for \"Where's hot\" on the month pages." }
      - { label: When to go text, name: when_to_go, widget: text, required: false }

      - label: Things to do
        name: things
        widget: list
        required: false
        summary: "{{name}}"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tag, name: tag, widget: string, required: false, hint: "One word, e.g. Free, Indoors, Ticketed, Summer." }
          - { label: Description, name: blurb, widget: text, required: false }
          - { label: Photo, name: image, widget: image, required: false }
          - { label: Photo description, name: image_alt, widget: string, required: false }

      - label: Common questions
        name: faqs
        widget: list
        required: false
        summary: "{{question}}"
        hint: These can show up as questions and answers in Google.
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

      - label: If you like this
        name: similar
        widget: list
        required: false
        summary: "{{name}}"
        hint: Places that link to their own guide when one is published with the same name.
        fields:
          - { label: Place name, name: name, widget: string }
          - { label: Code, name: code, widget: string, hint: "Three letters, e.g. BOS." }
          - { label: Label, name: label, widget: string, required: false, hint: "e.g. 🏙️ City break" }

      # Filled in by the editor when a guide is saved; anything that adds or changes guides outside the
      # editor sets them too (a test checks every guide has both).
      - { label: Added, name: date, widget: datetime, picker_utc: true, auto_now: [create], hint: "When the guide was added. Only shown here, not on the site." }
      - { label: Updated, name: updated, widget: datetime, picker_utc: true, auto_now: true, hint: "When the guide was last saved. Only shown here, not on the site." }

  - name: hubs
    label: Hub pages
    label_singular: Hub page
    description: Pages that list every guide for one kind of holiday (Beach holidays), one country (Holidays in Spain) one month (Where to go on holiday in February) or a hand-picked collection (Christmas holidays). The guides on each come from the guides themselves, so these only hold the words, except a collection, which lists the guides you pick. A month page lists every guide rated "Best" for that month, then the ones rated "Good". Untick "Published" to take one off the site.
    folder: content/hubs
    format: json
    extension: json
    create: true
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
    preview_path: destinations/{{slug}}
    editor:
      preview: false
    fields:
      - { label: Published, name: published, widget: boolean, default: false, hint: "Only published hubs with at least one guide appear on the site and in the sitemap." }
      - label: Kind of hub
        name: kind
        widget: select
        default: type
        options:
          - { label: "A kind of holiday", value: type }
          - { label: "A country", value: country }
          - { label: "A month", value: month }
          - { label: "A collection I pick", value: collection }
      - label: Holiday type
        name: holiday_type
        widget: select
        required: false
        hint: For a kind of holiday. Lists every guide with this in "Best for".
        options:
          - { label: "🏙️ City break", value: city }
          - { label: "🏖️ Beach", value: beach }
          - { label: "🥾 Nature & hiking", value: nature }
          - { label: "🧗 Adventure", value: adventure }
          - { label: "🏛️ Culture & history", value: culture }
          - { label: "🍷 Food & drink", value: food }
          - { label: "🚗 Road trip", value: road-trip }
          - { label: "🛳️ Cruise", value: cruise }
          - { label: "🚆 By train", value: rail }
          - { label: "⛷️ Skiing", value: ski }
          - { label: "🧘 Relax & spa", value: relax }
      - { label: Country code, name: country, widget: string, required: false, hint: "For a country. Its two-letter code, e.g. ES for Spain or US for the United States. Lists every guide in that country." }
      - label: Month
        name: month
        widget: select
        required: false
        hint: For a month. Lists every guide rated "Best" that month, then the ones rated "Good". A collection can have a month too (December for Christmas), and its page is then about that month.
        options:
          - { label: January, value: jan }
          - { label: February, value: feb }
          - { label: March, value: mar }
          - { label: April, value: apr }
          - { label: May, value: may }
          - { label: June, value: jun }
          - { label: July, value: jul }
          - { label: August, value: aug }
          - { label: September, value: sep }
          - { label: October, value: oct }
          - { label: November, value: nov }
          - { label: December, value: dec }
      - label: Guides
        name: guides
        widget: relation
        collection: destinations
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: For a collection. The guides it lists, shown A to Z.
      - { label: Emoji, name: icon, widget: string, required: false, hint: "For a collection. One emoji for its links, e.g. 🎄." }
      - { label: Link name, name: name, widget: string, hint: "Short, for links and the breadcrumb, e.g. Beach holidays, Spain or February." }
      - { label: Page heading, name: title, widget: string, hint: "e.g. Beach holidays, Holidays in Spain or Where to go on holiday in February. A new hub's address comes from this, e.g. somewhere.party/destinations/holidays-in-spain, so it mustn't be the same as a guide's." }
      - { label: Introduction, name: intro, widget: text, hint: "One or two sentences under the heading. Google also shows this under the page title in search results, cut off after about 155 characters, so put the most important part first." }
      - { label: Google title, name: seo_title, widget: string, required: false, hint: "Optional. The page title in search results, about 50 characters. Leave empty for \"Beach holidays: where to go and when\"." }
      - { label: Google description, name: seo_description, widget: text, required: false, hint: "Optional. Shown under the title in search results, cut off after about 155 characters. Leave empty to use the introduction." }
      - label: Longer writing
        name: sections
        widget: list
        required: false
        summary: "{{heading}}"
        hint: "Optional. Sections of writing under the guides, like a blog post's. A blank line starts a new paragraph, lines starting \"- \" make a list, **two stars** make bold and [words](/address) make a link."
        fields:
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Text, name: text, widget: text }
      - label: Common questions
        name: faqs
        widget: list
        required: false
        summary: "{{question}}"
        hint: Shown near the bottom of the page. These can show up as questions and answers in Google.
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

