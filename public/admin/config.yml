              - { label: 4. Next departure (boarding pass), name: departure, widget: object, fields: [{ label: Small heading, name: kicker, widget: string, required: false }, { label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Leave a blank line between paragraphs." }] }
              - { label: 5. Trip plan (itinerary, costs, packing), name: plan, widget: object, fields: [{ label: Small heading, name: kicker, widget: string, required: false }, { label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Leave a blank line between paragraphs." }] }
      - name: featured_creators
