# Settings for the content editor at somewhere.party/admin (Sveltia CMS, https://sveltiacms.app).
# Saving in the editor commits to the main branch, and Cloudflare redeploys the site with the change.
# Each destination is one JSON file in content/destinations; src/destinations.ts reads them.

backend:
  name: github
  repo: MattGibbard/NextTrip
  branch: main
  # GitHub sign-in runs in the site's own Worker (worker/cms.ts).
  base_url: https://somewhere.party
  auth_endpoint: api/cms/auth
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Remove {{collection}}: {{slug}}"
    uploadMedia: "Upload {{path}}"
    deleteMedia: "Delete {{path}}"

site_url: https://somewhere.party
display_url: https://somewhere.party

# Photos are saved in the repository and served from /images/destinations.
media_folder: /public/images/destinations
public_folder: /images/destinations
media_libraries:
  default:
    config:
      # Big photos are shrunk and turned into WebP on upload so pages stay quick.
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600

collections:
  - name: destinations
    label: Guides
    label_singular: Guide
    description: Family holiday guides at somewhere.party/destinations. Untick "Published" to keep one off the site.
    folder: content/destinations
    format: json
    extension: json
    create: true
    identifier_field: name
    slug: "{{slug}}"
    # The list shows when each guide was added. `date` and `updated` are only for the editor; the site
    # doesn't show them. A field called `date` also stops the editor offering its own "Updated on" sort,
    # which uses each file's last commit and so is no help after a change that touches every guide.
    summary: "{{name}}, {{country}} · added {{date | date('D MMM YYYY')}}"
    sortable_fields:
      fields: [name, country, date, updated]
      default: { field: date, direction: descending }
    preview_path: destinations/{{slug}}
    fields:
      - { label: Place name, name: name, widget: string, hint: "As people search for it, e.g. New York. The page address comes from this." }
      - { label: Published, name: published, widget: boolean, default: false, hint: "Only published guides appear on the site and in the sitemap." }
      - label: Country
        name: country
        widget: select
        hint: The place name and country are used to find it on the map and work out the flight time when the site builds.
