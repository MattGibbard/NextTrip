          - { label: Text, name: text, widget: text }
          - { label: Photo, name: image, widget: image, required: false, media_folder: /public/images/blog, public_folder: /images/blog, hint: "Optional. Shown after this section's words. Landscape, about 1280 pixels wide, e.g. from Pixabay (download it, don't link to it). Sections that link a guide show its photo on their own, so only add one where no guide photo fits." }
          - { label: Photo description, name: image_alt, widget: string, required: false, hint: "What's in the photo, for people who can't see it and for Google." }
          - { label: Photo caption, name: image_caption, widget: string, required: false, hint: "Optional. A short line under the photo." }
