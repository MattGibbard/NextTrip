        description: Creators who endorse us, shown on the home page above the sign-up box and on the creators page. The section stays hidden until at least one creator is added and switched on.
        fields:
          - { label: Small heading, name: kicker, widget: string, required: false }
          - { label: Heading, name: heading, widget: string, required: false }
