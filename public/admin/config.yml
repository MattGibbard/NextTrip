      - name: redirects
        label: Redirects
        file: content/site/redirects.json
        description: Old addresses that now live somewhere else. Anyone who visits the old address, or follows an old link to it from Google, is sent straight on to the new one, and search engines move the page over. Add one when you delete, merge or rename a page. A redirect only starts working once nothing is left at the old address, so it can never hide a page that's still on the site. Check the new address opens before saving.
        fields:
          - label: Redirects
            name: redirects
            widget: list
            required: false
            summary: "{{from}} → {{to}}"
            fields:
              - { label: Old address, name: from, widget: string, hint: "The part after somewhere.party, e.g. /blog/old-post." }
              - { label: New address, name: to, widget: string, hint: "Where it lives now, e.g. /destinations/where-to-go-in-december, or a full address starting https:// for another site." }

  - name: pages
    label: Pages
    description: The About, FAQ, Contact, How we make money and how-to-decide guide pages. Each has the same parts, and any part left empty is simply left out.
    format: json
    editor:
      preview: false
    files:
      - name: decide
        label: How to decide where to go (guide)
        file: content/pages/how-to-decide.json
        description: "The page at somewhere.party/how-to-decide-where-to-go-on-holiday. The guide aimed at people for how to decide where to go on holiday. Linked from the footer."
        fields: &page_fields
          - { label: Google title, name: seo_title, widget: string, hint: "The page title in search results and browser tabs. About 60 characters." }
          - { label: Google description, name: seo_description, widget: text, hint: "Shown under the title in search results, cut off after about 155 characters." }
          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: kicker, widget: string, required: false }
              - { label: Main heading, name: heading, widget: string }
              - { label: Introduction, name: lead, widget: text, required: false, hint: "Put **two stars** around words to make them bold, and [words](/faq) to make a link." }
              - { label: Button text, name: button_label, widget: string, required: false, hint: "Leave empty for no button." }
              - { label: Button link, name: button_url, widget: string, required: false, hint: "A page on the site such as /faq, a full address starting https://, or an email address as mailto:hello@somewhere.party" }
          - label: Sections
            name: sections
            widget: list
            required: false
            summary: "{{heading}}"
            hint: Pages with five or more sections get an "On this page" list at the top.
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Text, name: text, widget: text, hint: "Leave a blank line between paragraphs. Start a line with - (dash and space) for a bullet point. **Two stars** make words bold, [words](/destinations) makes a link." }
          - label: Steps board
            name: board
            widget: object
            hint: Optional. A dark departures board of steps with a Start planning button, shown after the sections.
            fields:
              - { label: Board label, name: label, widget: string, required: false }
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Steps
                name: steps
                widget: list
                required: false
                summary: "{{title}}"
                hint: Leave empty for no board. The last step's status lights up.
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: text, widget: text, required: false }
                  - { label: Status, name: status, widget: string, required: false, hint: "e.g. On standby, Boarding" }
          - label: Questions and answers
            name: faqs
            widget: object
            hint: Optional. Shown at the bottom as questions that open when tapped, and given to Google as an FAQ.
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - label: Questions
                name: items
                widget: list
                required: false
                summary: "{{question}}"
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Answer, name: answer, widget: text, hint: "**Two stars** make words bold, [words](/faq) makes a link." }
      - name: faq
        label: FAQ
        file: content/pages/faq.json
        description: "The page at somewhere.party/faq. Questions and answers. Linked from the footer."
        fields: *page_fields
      - name: about
        label: About us
        file: content/pages/about.json
        description: "The page at somewhere.party/about. Who we are and why somewhere🎉 exists. Linked from the footer."
        fields: *page_fields
      - name: contact
        label: Contact us
        file: content/pages/contact.json
        description: "The page at somewhere.party/contact. How to get in touch. The footer's Contact us link goes straight to Instagram for now."
        fields: *page_fields
      - name: money
        label: How we make money
        file: content/pages/how-we-make-money.json
        description: "The page at somewhere.party/how-we-make-money. How the site pays its way: affiliate links. Linked from the footer and the note under the Find flights and Find hotels buttons."
        fields: *page_fields
