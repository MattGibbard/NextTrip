          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }

  - name: site
    label: Site
    description: The home page's words, the announcement banner across the top of every page, the creators page and the creators featured on the home page, the welcome steps new people see when they first sign in, and redirects from old addresses.
    format: json
    editor:
      preview: false
    files:
      - name: banner
        label: Announcement banner
        file: content/site/banner.json
        fields:
          - { label: Show the banner, name: show, widget: boolean, default: false, hint: "Untick to take it down." }
          - { label: Message, name: text, widget: string, required: false, hint: "One short sentence, e.g. New: guides to New York and Orlando." }
          - { label: Link text, name: link_text, widget: string, required: false, hint: "e.g. Take a look. Leave empty for no link." }
          - { label: Link address, name: link_url, widget: string, required: false, hint: "A page on the site such as /destinations, or a full address starting https://" }
          - label: Colour
            name: style
            widget: select
            default: news
            options:
              - { label: Teal (news), value: news }
              - { label: Dark (celebration), value: celebrate }
              - { label: Orange (important), value: warning }
          - { label: Last day, name: ends, widget: datetime, required: false, time_format: false, date_format: YYYY-MM-DD, format: YYYY-MM-DD, hint: "Optional. The banner hides itself after this day." }

      - name: home
        label: Home page
        file: content/site/home.json
        fields:
          - { label: Google title, name: seo_title, widget: string, hint: "The page title in search results and browser tabs. About 60 characters." }
          - { label: Google description, name: seo_description, widget: text, hint: "Shown under the title in search results, cut off after about 155 characters." }
          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Small heading, name: kicker, widget: string, required: false }
              - { label: Main heading, name: heading, widget: string }
              - { label: Introduction, name: lead, widget: text, required: false }
              - { label: Sign-up button, name: button, widget: string, hint: "e.g. Start your list" }
              - { label: Line under the sign-up box, name: note, widget: string, required: false }
          - label: How it works (one idea's journey)
            name: journey
            widget: object
            hint: Each chapter sits beside its own picture of Ella's Lake Garda idea, so chapters can't be added or reordered here.
            fields:
              - { label: Small heading, name: kicker, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: "01. On standby (the pool of ideas)", name: standby, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Put [words](/destinations) in square brackets and the address in round ones to make a link." }] }
              - { label: "02. Points in secret (people locking in)", name: points, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Put [words](/destinations) in square brackets and the address in round ones to make a link." }] }
              - { label: "03. The draw (departures board)", name: draw, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Put [words](/destinations) in square brackets and the address in round ones to make a link." }] }
              - { label: "04. The trip plan (boarding pass)", name: plan, widget: object, fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text, hint: "Put [words](/destinations) in square brackets and the address in round ones to make a link." }] }
          - label: Postcards (after the trip)
            name: postcards
            widget: object
            fields:
              - { label: Small heading, name: kicker, widget: string, required: false }
              - { label: Heading, name: heading, widget: string }
              - { label: Text, name: text, widget: text, required: false }
          - label: Questions
            name: faq
            widget: object
            hint: Also shown to Google as questions and answers.
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Questions
                name: questions
                widget: list
                summary: "{{question}}"
                fields:
                  - { label: Question, name: question, widget: string }
                  - { label: Answer, name: answer, widget: text, hint: "Put [words](/destinations) in square brackets and the address in round ones to make a link." }
          - label: Call to action at the bottom
            name: cta
            widget: object
            hint: The button takes people back up to the sign-up box.
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Button, name: button, widget: string }
      - name: how_it_works
        label: How it works page
        file: content/site/how-it-works.json
        description: The page at somewhere.party/how-it-works. Each step sits beside its own animation, so steps can't be added or reordered here.
        fields:
          - { label: Google title, name: seo_title, widget: string, hint: "The page title in search results and browser tabs. About 60 characters." }
