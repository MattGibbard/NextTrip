      - { label: Page heading, name: title, widget: string, hint: "e.g. Holidays in New York." }
      - { label: Introduction, name: intro, widget: text, hint: "One or two sentences under the heading. Google also shows this under the page title in search results, cut off after about 155 characters, so put the most important part first." }
      - { label: Google title, name: seo_title, widget: string, required: false, hint: "Optional. The page title in search results, about 50 characters. Leave empty for \"New York holiday guide: when to go and what to do\"." }
      - { label: Google description, name: seo_description, widget: text, required: false, hint: "Optional. Shown under the title in search results, cut off after about 155 characters. Leave empty to use the introduction." }
      - { label: Main photo, name: image, widget: image, required: false, hint: "Wide and bright. Also used when the page is shared." }
      - { label: Main photo description, name: image_alt, widget: string, required: false, hint: "What's in the photo, for people who can't see it." }

      - { label: To code, name: to_code, widget: string, hint: "Three letters, e.g. NYC or ORL." }
      - label: Best for
        name: holiday_types
        widget: select
        multiple: true
        options:
              - { label: "🏙️ City break", value: city }
              - { label: "🏖️ Beach", value: beach }
              - { label: "🥾 Nature & hiking", value: nature }
              - { label: "🧗 Adventure", value: adventure }
              - { label: "🏛️ Culture & history", value: culture }
              - { label: "🍷 Food & drink", value: food }
              - { label: "🚗 Road trip", value: road-trip }
              - { label: "🛳️ Cruise", value: cruise }
              - { label: "🚆 By train", value: rail }
              - { label: "⛷️ Skiing", value: ski }
              - { label: "🧘 Relax & spa", value: relax }
      - { label: Nights away, name: nights, widget: string, required: false, hint: "e.g. 4 to 6" }
      - label: Trip length
        name: trip_length
        widget: select
        required: false
        hint: Filled in when a family adds this to their ideas.
        options:
          - { label: Long weekend, value: weekend }
          - { label: About a week, value: week }
          - { label: Two weeks, value: two-weeks }
          - { label: Three weeks+, value: longer }
      - label: Budget
        name: budget
        widget: select
        required: false
        options:
          - { label: "£ Cheap", value: 1 }
          - { label: "££ Mid-range", value: 2 }
          - { label: "£££ Splurge", value: 3 }

      - label: At a glance
        name: facts
        widget: list
        required: false
        summary: "{{label}}: {{value}}"
        hint: The departures-board rows. The flight time is added automatically, so ideas are time difference, currency, entry and plugs.
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
          - { label: Highlight, name: highlight, widget: boolean, default: false, hint: "Lights the value up in teal." }
      - { label: Note under the board, name: facts_note, widget: string, required: false }

      - label: When to go
        name: months
        widget: object
        hint: How good each month is, with a word or two about it. The "Best months" at the top of the page come from the months marked Best.
